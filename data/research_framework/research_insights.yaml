    summary: "The benchmark behind every reported excess_return (verifier._get_cb_index, data/benchmarks/cb_equal.parquet) is the mean close of all listed CBs. That is a price level, not a return: new issues enter near par and called bonds leave near their highs, so the series sags. Over 2019-2024 it gains 27% while the equal-weight return of holding every listed CB compounds to 87%-99%."
